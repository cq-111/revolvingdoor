<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revolving Door — 个人风格知识库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg-deep:#0a0a0f;--bg-mid:#12121a;
  --stair-light:#c8c8d0;--stair-mid:#8a8a96;--stair-dark:#4a4a56;
  --text-primary:#d0d0d8;--text-dim:#6a6a76;--accent:#9a8a6a;
  --glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.08);
}
html{scroll-behavior:smooth;}
body{font-family:'Helvetica Neue',Arial,'Noto Sans SC',sans-serif;background:var(--bg-deep);color:var(--text-primary);overflow-x:hidden;min-height:100vh;}

#cosmos{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
.nebula{position:fixed;border-radius:50%;filter:blur(120px);opacity:0.12;pointer-events:none;z-index:0;animation:nebulaDrift 40s ease-in-out infinite alternate;}
.nebula-1{width:600px;height:600px;background:#3a2a5a;top:-200px;left:-100px;}
.nebula-2{width:500px;height:500px;background:#1a3a4a;bottom:-150px;right:-100px;animation-delay:-15s;}
.nebula-3{width:400px;height:400px;background:#5a2a3a;top:40%;left:50%;animation-delay:-25s;opacity:0.08;}
@keyframes nebulaDrift{0%{transform:translate(0,0) scale(1);}100%{transform:translate(30px,-20px) scale(1.1);}}

nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:16px 40px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(10,10,15,0.95) 0%,transparent 100%);backdrop-filter:blur(10px);}
.nav-logo{font-size:14px;letter-spacing:6px;text-transform:uppercase;color:var(--stair-light);font-weight:300;}
.nav-links{display:flex;gap:28px;}
.nav-links a{color:var(--text-dim);text-decoration:none;font-size:12px;letter-spacing:2px;text-transform:uppercase;transition:color 0.3s;cursor:pointer;}
.nav-links a:hover{color:var(--stair-light);}

.page{display:none;position:relative;z-index:2;min-height:100vh;padding:100px 40px 60px;}
.page.active{display:block;}

#page-home{padding-top:60px;}
#page-home.active{display:flex;flex-direction:column;align-items:center;}

.hero-title{text-align:center;margin-bottom:20px;flex-shrink:0;}
.hero-title h1{font-size:clamp(28px,5vw,56px);font-weight:200;letter-spacing:14px;text-transform:uppercase;color:var(--stair-light);text-shadow:0 0 60px rgba(200,200,210,0.15);}
.hero-title p{margin-top:14px;font-size:12px;letter-spacing:6px;color:var(--text-dim);text-transform:uppercase;font-style:italic;}

.stair-scene{width:min(1100px,96vw);height:min(680px,74vh);position:relative;perspective:1700px;perspective-origin:50% 45%;flex-shrink:0;}
.stair-pivot{width:100%;height:100%;position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform;}

.stair-step{position:absolute;left:50%;top:50%;width:220px;height:26px;margin-left:-110px;margin-top:-13px;transform-style:preserve-3d;cursor:pointer;}
.stair-step .face-top{position:absolute;left:0;top:0;width:100%;height:88px;background:linear-gradient(135deg,#e8e8f0 0%,#b8b8c4 35%,#7a7a86 100%);border:1px solid rgba(230,230,240,0.45);border-radius:3px;transform-origin:center top;transform:rotateX(-90deg);box-shadow:inset 0 1px 0 rgba(255,255,255,0.5),inset 1px 0 0 rgba(255,255,255,0.2),inset -1px 0 0 rgba(0,0,0,0.2),0 0 50px rgba(190,190,220,0.22);transition:background 0.35s,box-shadow 0.35s;}
.stair-step .face-front{position:absolute;left:0;top:0;width:100%;height:26px;background:linear-gradient(180deg,#7a7a86 0%,#3a3a46 55%,#1a1a24 100%);border:1px solid rgba(200,200,210,0.15);border-top:none;border-radius:0 0 3px 3px;transform:translateZ(-88px) translateY(0);transition:background 0.35s;}
.stair-step .face-side{position:absolute;left:0;top:0;width:88px;height:26px;background:linear-gradient(90deg,#5a5a66 0%,#2a2a34 100%);border:1px solid rgba(200,200,210,0.1);border-right:none;border-radius:3px 0 0 3px;transform-origin:left center;transform:translateZ(-44px) translateX(-44px) rotateY(-90deg);transition:background 0.35s;}
.stair-step:hover .face-top{background:linear-gradient(135deg,#ffffff 0%,#d0d0dc 40%,#a0a0ac 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),inset 1px 0 0 rgba(255,255,255,0.3),inset -1px 0 0 rgba(0,0,0,0.25),0 0 80px rgba(220,220,240,0.4);}
.stair-step:hover .face-front{background:linear-gradient(180deg,#9a9aa6 0%,#5a5a66 55%,#3a3a46 100%);}
.stair-step:hover .face-side{background:linear-gradient(90deg,#8a8a96 0%,#4a4a56 100%);}

.stair-step.empty .face-top{background:linear-gradient(135deg,#4a4a56 0%,#2a2a34 50%,#1a1a24 100%);border-color:rgba(200,200,210,0.15);box-shadow:inset 0 1px 0 rgba(200,200,210,0.15),0 0 30px rgba(120,120,140,0.15);}
.stair-step.empty .face-front{background:linear-gradient(180deg,#3a3a46 0%,#1a1a24 55%,#0a0a10 100%);}
.stair-step.empty .face-side{background:linear-gradient(90deg,#2a2a34 0%,#101018 100%);}
.stair-step.empty:hover .face-top{background:linear-gradient(135deg,#7a7a86 0%,#5a5a66 50%,#3a3a46 100%);}

.stair-label{position:absolute;left:100%;top:50%;transform:translateY(-50%) translateZ(-44px);margin-left:16px;padding:5px 14px;font-size:11px;letter-spacing:3px;color:var(--stair-light);white-space:nowrap;background:rgba(10,10,15,0.7);border:1px solid rgba(200,200,210,0.18);border-radius:2px;backdrop-filter:blur(6px);opacity:0.55;transition:opacity 0.3s,background 0.3s,border-color 0.3s,transform 0.3s;pointer-events:none;font-family:inherit;}
.stair-step.empty .stair-label{color:var(--text-dim);font-style:italic;opacity:0.4;}
.stair-step:hover .stair-label{opacity:1;background:rgba(200,200,210,0.12);border-color:rgba(200,200,210,0.4);transform:translateY(-50%) translateZ(-44px) translateX(4px);}

.stair-glow{position:absolute;left:50%;top:5%;width:2px;height:90%;margin-left:-1px;background:linear-gradient(180deg,transparent,rgba(200,200,210,0.08),rgba(200,200,210,0.12),rgba(200,200,210,0.08),transparent);pointer-events:none;z-index:-1;}

.add-node-btn{position:fixed;bottom:32px;right:32px;z-index:50;padding:14px 26px;background:rgba(154,138,106,0.15);border:1px solid rgba(154,138,106,0.4);color:var(--accent);font-size:12px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:2px;font-family:inherit;backdrop-filter:blur(8px);transition:all 0.3s;}
.add-node-btn:hover{background:rgba(154,138,106,0.3);border-color:rgba(154,138,106,0.7);transform:translateY(-2px);box-shadow:0 8px 24px rgba(154,138,106,0.2);}

#musicToggle{position:fixed;bottom:32px;left:32px;z-index:50;width:52px;height:52px;border-radius:50%;background:rgba(154,138,106,0.15);border:1px solid rgba(154,138,106,0.4);color:var(--accent);font-size:20px;cursor:pointer;transition:all 0.3s;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);font-family:inherit;}
#musicToggle:hover{background:rgba(154,138,106,0.3);border-color:rgba(154,138,106,0.7);transform:scale(1.08);box-shadow:0 0 24px rgba(154,138,106,0.3);}
#musicToggle.playing{background:rgba(154,138,106,0.35);border-color:rgba(154,138,106,0.8);box-shadow:0 0 32px rgba(154,138,106,0.4);animation:musicPulse 2s ease-in-out infinite;}
#musicToggle.playing #musicIcon{animation:musicSpin 4s linear infinite;display:inline-block;}
@keyframes musicPulse{0%,100%{box-shadow:0 0 20px rgba(154,138,106,0.3);}50%{box-shadow:0 0 40px rgba(154,138,106,0.5);}}
@keyframes musicSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

#page-index{max-width:1200px;margin:0 auto;}
.index-header{margin-bottom:40px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;}
.index-header h2{font-size:28px;font-weight:200;letter-spacing:8px;text-transform:uppercase;color:var(--stair-light);margin-bottom:8px;}
.index-header p{font-size:12px;color:var(--text-dim);letter-spacing:2px;}
.add-art-btn{padding:12px 24px;background:rgba(154,138,106,0.15);border:1px solid rgba(154,138,106,0.4);color:var(--accent);font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:2px;font-family:inherit;transition:all 0.3s;}
.add-art-btn:hover{background:rgba(154,138,106,0.3);border-color:rgba(154,138,106,0.7);transform:translateY(-2px);}

.filter-bar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px;}
.filter-btn{padding:8px 18px;background:var(--glass);border:1px solid var(--glass-border);border-radius:2px;color:var(--text-dim);font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.3s;font-family:inherit;}
.filter-btn:hover,.filter-btn.active{background:rgba(200,200,210,0.1);border-color:rgba(200,200,210,0.3);color:var(--stair-light);}

.search-wrap{margin-bottom:30px;}
.search-wrap input{width:100%;max-width:520px;padding:14px 20px;background:var(--glass);border:1px solid var(--glass-border);border-radius:2px;color:var(--text-primary);font-size:14px;font-family:inherit;letter-spacing:1px;outline:none;transition:border-color 0.3s;}
.search-wrap input::placeholder{color:var(--text-dim);}
.search-wrap input:focus{border-color:rgba(200,200,210,0.3);}

.work-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;}
.work-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:2px;padding:24px;transition:all 0.35s;cursor:pointer;position:relative;overflow:hidden;}
.work-card:hover{border-color:rgba(200,200,210,0.25);background:rgba(255,255,255,0.06);transform:translateY(-3px);}
.work-card::before{content:'';position:absolute;top:0;left:0;width:2px;height:0;background:var(--accent);transition:height 0.4s;}
.work-card:hover::before{height:100%;}
.work-card .card-img{width:100%;height:160px;background:linear-gradient(135deg,#1a1a24,#2a2a38);border-radius:2px;margin-bottom:16px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;}
.work-card .card-img img{width:100%;height:100%;object-fit:cover;opacity:0.85;transition:opacity 0.3s,transform 0.4s;}
.work-card:hover .card-img img{opacity:1;transform:scale(1.04);}
.card-img .placeholder-icon{font-size:36px;color:var(--stair-dark);letter-spacing:4px;}
.work-card h3{font-size:15px;font-weight:400;color:var(--stair-light);letter-spacing:1px;margin-bottom:6px;}
.work-card .meta{font-size:11px;color:var(--text-dim);letter-spacing:1px;margin-bottom:12px;}
.work-card .desc{font-size:12px;color:var(--text-dim);line-height:1.7;margin-bottom:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.tag{padding:3px 10px;font-size:10px;letter-spacing:1px;border-radius:2px;background:rgba(200,200,210,0.06);color:var(--text-dim);border:1px solid rgba(200,200,210,0.08);}
.tag.medium{background:rgba(154,138,106,0.12);color:#9a8a6a;border-color:rgba(154,138,106,0.2);}
.tag.theory{background:rgba(100,120,160,0.1);color:#7a8ab0;border-color:rgba(100,120,160,0.18);}
.work-card .card-link{font-size:11px;color:var(--accent);letter-spacing:1px;display:inline-block;border-bottom:1px solid transparent;transition:border-color 0.3s;}
.work-card:hover .card-link{border-bottom-color:var(--accent);}
.empty-state{grid-column:1/-1;text-align:center;padding:80px 20px;color:var(--text-dim);font-size:13px;letter-spacing:2px;}

#page-detail{max-width:1200px;margin:0 auto;}
.detail-back{margin-bottom:30px;display:flex;gap:12px;flex-wrap:wrap;}
.detail-back button{background:var(--glass);border:1px solid var(--glass-border);color:var(--text-dim);padding:10px 22px;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:all 0.3s;font-family:inherit;}
.detail-back button:hover{color:var(--stair-light);border-color:rgba(200,200,210,0.3);background:rgba(200,200,210,0.08);}
.detail-back button.edit-btn{background:rgba(154,138,106,0.12);border-color:rgba(154,138,106,0.35);color:var(--accent);}
.detail-back button.edit-btn:hover{background:rgba(154,138,106,0.25);border-color:rgba(154,138,106,0.6);}
.detail-back button.danger{color:#a06060;border-color:rgba(160,96,96,0.3);background:rgba(160,96,96,0.08);}
.detail-back button.danger:hover{background:rgba(160,96,96,0.2);border-color:rgba(160,96,96,0.6);color:#d08080;}

.detail-hero{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-bottom:60px;align-items:start;}
.detail-image{width:100%;aspect-ratio:4/3;background:linear-gradient(135deg,#1a1a24,#2a2a38);border:1px solid var(--glass-border);border-radius:3px;overflow:hidden;display:flex;align-items:center;justify-content:center;position:sticky;top:100px;}
.detail-image img{width:100%;height:100%;object-fit:cover;display:block;}
.img-placeholder{font-size:64px;color:var(--stair-dark);letter-spacing:8px;display:flex;align-items:center;justify-content:center;width:100%;height:100%;}
.detail-meta{padding-top:10px;}
.detail-year{font-size:14px;color:var(--accent);letter-spacing:4px;margin-bottom:12px;font-weight:300;}
.detail-title{font-size:clamp(24px,3.5vw,40px);font-weight:200;letter-spacing:2px;color:var(--stair-light);margin-bottom:14px;line-height:1.3;}
.detail-artist{font-size:14px;color:var(--text-dim);letter-spacing:2px;margin-bottom:24px;padding-bottom:24px;border-bottom:1px solid var(--glass-border);}
.detail-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:30px;}
.detail-tags .tag{font-size:11px;padding:5px 14px;}
.detail-link{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:rgba(154,138,106,0.1);border:1px solid rgba(154,138,106,0.25);color:var(--accent);text-decoration:none;font-size:12px;letter-spacing:2px;border-radius:2px;transition:all 0.3s;}
.detail-link:hover{background:rgba(154,138,106,0.2);border-color:rgba(154,138,106,0.5);transform:translateX(4px);}
.detail-content section{margin-bottom:50px;max-width:820px;}
.detail-content h2{font-size:13px;font-weight:400;letter-spacing:5px;text-transform:uppercase;color:var(--accent);margin-bottom:20px;padding-bottom:12px;border-bottom:1px solid var(--glass-border);}
.detail-content p{font-size:14px;line-height:2;color:var(--text-primary);letter-spacing:0.5px;opacity:0.85;white-space:pre-wrap;}

#page-log{max-width:900px;margin:0 auto;}
.log-header{margin-bottom:50px;padding-bottom:30px;border-bottom:1px solid var(--glass-border);}
.log-year-display{font-size:16px;color:var(--accent);letter-spacing:8px;margin-bottom:14px;font-weight:300;}
.log-title-display{font-size:clamp(24px,4vw,42px);font-weight:200;letter-spacing:4px;color:var(--stair-light);margin-bottom:24px;line-height:1.3;}
.log-actions{display:flex;gap:12px;flex-wrap:wrap;}
.log-actions button{padding:10px 26px;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:2px;font-family:inherit;transition:all 0.3s;background:var(--glass);border:1px solid var(--glass-border);color:var(--text-dim);}
.log-actions button:hover{color:var(--stair-light);border-color:rgba(200,200,210,0.3);background:rgba(200,200,210,0.08);}
.log-actions #logSaveBtn{background:rgba(154,138,106,0.15);border-color:rgba(154,138,106,0.35);color:var(--accent);}
.log-actions #logSaveBtn:hover{background:rgba(154,138,106,0.28);border-color:rgba(154,138,106,0.6);}
.log-actions #logDeleteBtn{color:#a06060;border-color:rgba(160,96,96,0.3);background:rgba(160,96,96,0.08);}
.log-actions #logDeleteBtn:hover{background:rgba(160,96,96,0.2);border-color:rgba(160,96,96,0.6);color:#d08080;}
.log-content{min-height:400px;}
.log-display{font-size:15px;line-height:2.2;color:var(--text-primary);letter-spacing:0.5px;white-space:pre-wrap;opacity:0.9;}
.log-editor{width:100%;min-height:500px;padding:24px;background:var(--glass);border:1px solid rgba(200,200,210,0.2);border-radius:3px;color:var(--text-primary);font-size:15px;line-height:2.2;letter-spacing:0.5px;font-family:inherit;resize:vertical;outline:none;transition:border-color 0.3s;}
.log-editor:focus{border-color:rgba(200,200,210,0.4);}
.log-input{width:100%;padding:14px 20px;background:var(--glass);border:1px solid rgba(200,200,210,0.2);border-radius:3px;color:var(--text-primary);font-size:15px;font-family:inherit;letter-spacing:2px;outline:none;transition:border-color 0.3s;margin-bottom:16px;}
.log-input:focus{border-color:rgba(200,200,210,0.4);}
.log-input.year-input{font-size:16px;letter-spacing:8px;color:var(--accent);}
.log-input.title-input{font-size:22px;font-weight:200;letter-spacing:3px;}

#page-edit{max-width:900px;margin:0 auto;}
.edit-form{display:flex;flex-direction:column;gap:8px;}
.edit-form label{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim);margin-top:14px;margin-bottom:-4px;}
.edit-form input,.edit-form textarea,.edit-form select{width:100%;padding:14px 20px;background:var(--glass);border:1px solid rgba(200,200,210,0.2);border-radius:3px;color:var(--text-primary);font-size:14px;font-family:inherit;letter-spacing:1px;outline:none;transition:border-color 0.3s;}
.edit-form input:focus,.edit-form textarea:focus,.edit-form select:focus{border-color:rgba(200,200,210,0.4);}
.edit-form textarea{min-height:180px;line-height:1.8;resize:vertical;}
.edit-form select{cursor:pointer;}
.edit-form select option{background:#12121a;color:var(--text-primary);}
.edit-form-actions{display:flex;gap:12px;margin-top:30px;}
.edit-form-actions button{padding:12px 30px;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:2px;font-family:inherit;transition:all 0.3s;background:var(--glass);border:1px solid var(--glass-border);color:var(--text-dim);}
.edit-form-actions button.primary{background:rgba(154,138,106,0.2);border-color:rgba(154,138,106,0.5);color:var(--accent);}
.edit-form-actions button.primary:hover{background:rgba(154,138,106,0.35);border-color:rgba(154,138,106,0.8);}
.edit-form-actions button:hover:not(.primary){color:var(--stair-light);border-color:rgba(200,200,210,0.3);background:rgba(200,200,210,0.08);}

#page-mind{max-width:1200px;margin:0 auto;}
.mind-container{position:relative;width:100%;min-height:600px;display:flex;justify-content:center;align-items:center;}
.mind-svg{width:100%;height:auto;max-height:80vh;}
.mind-svg text{font-family:'Helvetica Neue',Arial,'Noto Sans SC',sans-serif;fill:var(--text-dim);font-size:11px;}
.mind-svg .node-center{fill:var(--stair-light);font-size:14px;letter-spacing:4px;font-weight:300;}
.mind-svg .node-main{fill:var(--stair-light);font-size:12px;letter-spacing:2px;}
.mind-svg .node-leaf{font-size:10px;}
.mind-svg line,.mind-svg path{stroke:rgba(200,200,210,0.15);stroke-width:1;fill:none;}

footer{position:relative;z-index:2;text-align:center;padding:40px;font-size:11px;color:var(--text-dim);letter-spacing:2px;}

@media(max-width:900px){.detail-hero{grid-template-columns:1fr;gap:30px;}.detail-image{position:static;}}
@media(max-width:768px){
  nav{padding:12px 20px;}.nav-links{gap:14px;}.nav-links a{font-size:10px;letter-spacing:1px;}
  .page{padding:80px 20px 40px;}
  .stair-step{width:150px;height:20px;margin-left:-75px;margin-top:-10px;}
  .stair-step .face-top{height:64px;}
  .stair-step .face-front{height:20px;transform:translateZ(-64px);}
  .stair-step .face-side{width:64px;height:20px;transform:translateZ(-32px) translateX(-32px) rotateY(-90deg);}
  .stair-label{left:100%;margin-left:8px;font-size:9px;padding:3px 8px;letter-spacing:1px;}
  .work-grid{grid-template-columns:1fr;}
  .hero-title h1{letter-spacing:6px;}.hero-title p{letter-spacing:3px;font-size:10px;}
  .add-node-btn{bottom:20px;right:20px;padding:10px 18px;font-size:10px;}
  #musicToggle{bottom:20px;left:20px;width:44px;height:44px;font-size:16px;}
}
</style>
</head>
<body>

<canvas id="cosmos"></canvas>
<div class="nebula nebula-1"></div>
<div class="nebula nebula-2"></div>
<div class="nebula nebula-3"></div>

<nav>
  <div class="nav-logo">Revolving Door</div>
  <div class="nav-links">
    <a onclick="showPage('home')">时间</a>
    <a onclick="showPage('index')">索引</a>
    <a onclick="showPage('mind')">体系</a>
  </div>
</nav>

<!-- 背景音乐按钮 -->
<button id="musicToggle" onclick="toggleMusic()" title="播放/暂停背景音乐：Bauhaus - Bela Lugosi's Dead">

<script>
/* ============================================================
   背景音乐（Bauhaus - Bela Lugosi's Dead）
   ============================================================ */
let ytPlayerReady = false;
let musicPlaying = false;

(function loadYTAPI(){
  if(window.YT && window.YT.Player) return;
  const tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  document.head.appendChild(tag);
})();

window.onYouTubeIframeAPIReady = function(){
  new YT.Player('ytPlayer', {
    events: {
      'onReady': function(event){
        ytPlayerReady = true;
        event.target.setVolume(25);
      },
      'onStateChange': function(event){
        if(event.data === YT.PlayerState.ENDED){
          event.target.playVideo();
        }
      }
    }
  });
};

function toggleMusic(){
  const btn = document.getElementById('musicToggle');
  if(!ytPlayerReady){
    console.log('播放器尚未就绪，请稍候...');
    return;
  }
  const player = YT.get('ytPlayer');
  if(!player) return;

  if(musicPlaying){
    player.pauseVideo();
    musicPlaying = false;
    btn.classList.remove('playing');
  }else{
    player.playVideo();
    player.setVolume(25);
    musicPlaying = true;
    btn.classList.add('playing');
  }
}

/* ============================================================
   宇宙粒子背景
   ============================================================ */
(function(){
  const canvas=document.getElementById('cosmos');
  const ctx=canvas.getContext('2d');
  let W,H,particles=[];
  function resize(){W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  class P{
    constructor(){this.reset();this.y=Math.random()*H;}
    reset(){this.x=Math.random()*W;this.y=-10;this.size=Math.random()*1.8+0.3;this.speed=Math.random()*0.3+0.08;this.opacity=Math.random()*0.5+0.1;this.drift=(Math.random()-0.5)*0.15;}
    update(){this.y+=this.speed;this.x+=this.drift;if(this.y>H+10){this.reset();this.y=-10;}}
    draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fillStyle=`rgba(200,200,220,${this.opacity})`;ctx.fill();}
  }
  for(let i=0;i<160;i++) particles.push(new P());
  (function loop(){ctx.clearRect(0,0,W,H);particles.forEach(p=>{p.update();p.draw();});requestAnimationFrame(loop);})();
})();

/* ============================================================
   楼梯数据（默认 14 个空节点）
   ============================================================ */
const STAIR_KEY='rd-stairs-v2';
const DEFAULT_STAIR_COUNT=14;
function loadStairEntries(){
  try{
    const s=localStorage.getItem(STAIR_KEY);
    if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length>0)return a.map((e,i)=>({id:e.id||'s'+Date.now()+'_'+i,year:e.year||'',title:e.title||'',log:e.log||''}));}
  }catch(e){}
  const arr=[];
  for(let i=0;i<DEFAULT_STAIR_COUNT;i++) arr.push({id:'s'+i+'_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),year:'',title:'',log:''});
  return arr;
}
let stairEntries=loadStairEntries();
function saveStairEntries(){try{localStorage.setItem(STAIR_KEY,JSON.stringify(stairEntries));}catch(e){}}

/* 楼梯渲染 */
const pivot=document.getElementById('stairPivot');
const scene=document.getElementById('stairScene');
const RADIUS=170, VERT_STEP=42;
let offsetY=0, autoAngle=0, mouseAngle=0, targetAutoSpeed=0.1, currentAutoSpeed=targetAutoSpeed;

function renderStair(){
  pivot.innerHTML='';
  const N=stairEntries.length;
  const ANGLE_STEP=360/Math.max(N,8);
  const TOTAL_HEIGHT=(N-1)*VERT_STEP;
  offsetY=TOTAL_HEIGHT*0.45;
  for(let i=0;i<N;i++){
    const entry=stairEntries[i];
    const step=document.createElement('div');
    step.className='stair-step';
    const isEmpty=!entry.year && !entry.title;
    if(isEmpty) step.classList.add('empty');
    const angle=i*ANGLE_STEP;
    const rad=angle*Math.PI/180;
    const x=Math.cos(rad)*RADIUS, z=Math.sin(rad)*RADIUS, y=-i*VERT_STEP;
    step.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateY(${-angle}deg)`;
    let labelText;
    if(isEmpty) labelText='● 未命名节点';
    else if(entry.year&&entry.title) labelText=`${entry.year} · ${entry.title}`;
    else labelText=entry.year||entry.title;
    step.innerHTML=`<div class="face-top"></div><div class="face-front"></div><div class="face-side"></div><div class="stair-label">${labelText}</div>`;
    step.addEventListener('click',()=>openLog(entry.id));
    pivot.appendChild(step);
  }
}
function addNode(){
  const newEntry={id:'s_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),year:'',title:'',log:''};
  stairEntries.push(newEntry);
  saveStairEntries();
  renderStair();
  openLog(newEntry.id);
  toggleLogEdit();
}
scene.addEventListener('mousemove',(e)=>{
  const r=scene.getBoundingClientRect();
  mouseAngle=((e.clientX-r.left)/r.width-0.5)*70;
  currentAutoSpeed=0;
});
scene.addEventListener('mouseleave',()=>{mouseAngle=0;currentAutoSpeed=targetAutoSpeed;});
(function loop(){
  currentAutoSpeed+=(targetAutoSpeed-currentAutoSpeed)*0.03;
  autoAngle+=currentAutoSpeed;
  pivot.style.transform=`translateY(${offsetY}px) rotateX(20deg) rotateY(${autoAngle+mouseAngle}deg)`;
  requestAnimationFrame(loop);
})();

/* 日志 */
let currentLogId=null;
function openLog(id){
  const entry=stairEntries.find(e=>e.id===id);
  if(!entry) return;
  currentLogId=id;
  document.getElementById('logYearDisplay').textContent=entry.year||'（未填写年份）';
  document.getElementById('logTitleDisplay').textContent=entry.title||'（未命名节点）';
  const d=document.getElementById('logDisplay');
  d.textContent=entry.log||'还没有记录。点击"编辑"开始书写。';
  d.style.display='';
  document.getElementById('logEditorWrap').style.display='none';
  document.getElementById('logEditBtn').style.display='';
  document.getElementById('logSaveBtn').style.display='none';
  document.getElementById('logDeleteBtn').style.display='none';
  showPage('log');
}
function toggleLogEdit(){
  const entry=stairEntries.find(e=>e.id===currentLogId);
  if(!entry) return;
  document.getElementById('logYearInput').value=entry.year||'';
  document.getElementById('logTitleInput').value=entry.title||'';
  document.getElementById('logEditor').value=entry.log||'';
  document.getElementById('logDisplay').style.display='none';
  document.getElementById('logEditorWrap').style.display='';
  document.getElementById('logEditBtn').style.display='none';
  document.getElementById('logSaveBtn').style.display='';
  document.getElementById('logDeleteBtn').style.display='';
  document.getElementById('logYearInput').focus();
}
function saveLogContent(){
  const entry=stairEntries.find(e=>e.id===currentLogId);
  if(!entry) return;
  entry.year=document.getElementById('logYearInput').value.trim();
  entry.title=document.getElementById('logTitleInput').value.trim();
  entry.log=document.getElementById('logEditor').value;
  saveStairEntries();
  renderStair();
  openLog(currentLogId);
}
function deleteCurrentNode(){
  if(!currentLogId) return;
  if(stairEntries.length<=1){alert('至少保留一个节点。');return;}
  if(!confirm('确定删除这个节点吗？')) return;
  stairEntries=stairEntries.filter(e=>e.id!==currentLogId);
  saveStairEntries();
  renderStair();
  showPage('home');
}

/* 页面切换 */
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const t=document.getElementById('page-'+id);
  if(t) t.classList.add('active');
  window.scrollTo(0,0);
  const addBtn=document.querySelector('.add-node-btn');
  if(addBtn) addBtn.style.display=(id==='home')?'':'none';
}

/* 作品数据 */
const ART_KEY='rd-artworks-v1';
const DEFAULT_ARTWORKS=[

function loadArtworks(){
  try{
    const s=localStorage.getItem(ART_KEY);
    if(s){const a=JSON.parse(s);if(Array.isArray(a)&&a.length>0)return a;}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT_ARTWORKS));
}
let artworks=loadArtworks();
function saveArtworks(){try{localStorage.setItem(ART_KEY,JSON.stringify(artworks));}catch(e){}}

/* 索引渲染 */
const workGrid=document.getElementById('workGrid');
const filterBar=document.getElementById('filterBar');
const searchInput=document.getElementById('searchInput');
let currentFilter='all', currentSearch='';

function renderWorks(){
  const filtered=artworks.filter(w=>{
    let mf=true;
    if(currentFilter!=='all'){
      const isM=w.medium===currentFilter;
      const isT=w.theory&&w.theory.some(t=>t.includes(currentFilter));
      mf=isM||isT;
    }
    let ms=true;
    if(currentSearch){
      const s=currentSearch.toLowerCase();
      ms=(w.title.toLowerCase().includes(s)||w.artist.toLowerCase().includes(s)||w.medium.toLowerCase().includes(s)||(w.theory||[]).some(t=>t.toLowerCase().includes(s))||w.desc.toLowerCase().includes(s)||(w.artistInfo||'').toLowerCase().includes(s));
    }
    return mf&&ms;
  });
  if(filtered.length===0){
    workGrid.innerHTML='<div class="empty-state">暂无匹配的作品</div>';
    return;
  }
  workGrid.innerHTML=filtered.map(w=>{
    const idx=artworks.indexOf(w);
    const imgHtml=w.img?`<img src="${w.img}" alt="${w.title}" loading="lazy" onerror="this.style.display='none';this.parentNode.innerHTML='<span class=&quot;placeholder-icon&quot;>◆</span>'">`:'<span class="placeholder-icon">◆</span>';
    return `
      <div class="work-card" data-index="${idx}">
        <div class="card-img">${imgHtml}</div>
        <h3>${w.title}</h3>
        <div class="meta">${w.artist} · ${w.year}</div>
        <div class="desc">${w.desc}</div>
        <div class="tag-row">
          <span class="tag medium">${w.medium}</span>
          ${(w.theory||[]).map(t=>`<span class="tag theory">${t}</span>`).join('')}
        </div>
        <span class="card-link">查看详情 →</span>
      </div>
    `;
  }).join('');
}
workGrid.addEventListener('click',(e)=>{
  const card=e.target.closest('.work-card');
  if(!card) return;
  const idx=parseInt(card.dataset.index);
  if(!isNaN(idx)) openDetail(idx);
});
filterBar.addEventListener('click',(e)=>{
  const btn=e.target.closest('.filter-btn');
  if(!btn) return;
  filterBar.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentFilter=btn.dataset.filter;
  renderWorks();
});
searchInput.addEventListener('input',(e)=>{currentSearch=e.target.value.trim();renderWorks();});
renderWorks();

/* 详情页 */
let currentDetailIndex=-1;
function openDetail(index){
  const w=artworks[index];
  if(!w) return;
  currentDetailIndex=index;
  document.getElementById('detailTitle').textContent=w.title;
  document.getElementById('detailYear').textContent=w.year;
  document.getElementById('detailArtist').textContent=w.artist;
  document.getElementById('detailDesc').textContent=w.desc;
  document.getElementById('detailArtistInfo').textContent=w.artistInfo||'暂无介绍。';
  document.getElementById('detailTheoryText').textContent=`媒介类别：${w.medium}　|　相关理论：${(w.theory||[]).join('、')}`;
  const imgEl=document.getElementById('detailImg');
  const ph=document.getElementById('detailImgPlaceholder');
  if(w.img){
    imgEl.src=w.img;imgEl.style.display='block';ph.style.display='none';
    imgEl.onerror=()=>{imgEl.style.display='none';ph.style.display='flex';};
  }else{
    imgEl.style.display='none';ph.style.display='flex';
  }
  document.getElementById('detailTags').innerHTML=`<span class="tag medium">${w.medium}</span>`+(w.theory||[]).map(t=>`<span class="tag theory">${t}</span>`).join('');
  document.getElementById('detailLink').href=w.url||'#';
  showPage('detail');
}
function deleteArtwork(){
  if(currentDetailIndex<0) return;
  if(!confirm('确定删除这个作品吗？此操作不可恢复。')) return;
  artworks.splice(currentDetailIndex,1);
  saveArtworks();
  renderWorks();
  currentDetailIndex=-1;
  showPage('index');
}

/* 作品编辑页 */
let editingArtworkIndex=-1;
function openArtworkEditor(index){
  editingArtworkIndex=index;
  const isNew=index<0;
  document.getElementById('editPageTitle').textContent=isNew?'添加作品':'编辑作品';
  const w=isNew?{title:'',artist:'',year:'',medium:'平面类',theory:[],desc:'',artistInfo:'',url:'',img:''}:artworks[index];
  document.getElementById('editTitle').value=w.title||'';
  document.getElementById('editArtist').value=w.artist||'';
  document.getElementById('editYear').value=w.year||'';
  document.getElementById('editMedium').value=w.medium||'平面类';
  document.getElementById('editTheory').value=(w.theory||[]).join(', ');
  document.getElementById('editDesc').value=w.desc||'';
  document.getElementById('editArtistInfo').value=w.artistInfo||'';
  document.getElementById('editUrl').value=w.url||'';
  document.getElementById('editImg').value=w.img||'';
  showPage('edit');
}
function cancelArtworkEdit(){
  if(editingArtworkIndex>=0) showPage('detail');
  else showPage('index');
}
function saveArtworkEdit(){
  const title=document.getElementById('editTitle').value.trim();
  const artist=document.getElementById('editArtist').value.trim();
  if(!title||!artist){alert('请填写作品名称和艺术家/作者。');return;}
  const newData={
    title:title,
    artist:artist,
    year:document.getElementById('editYear').value.trim(),
    medium:document.getElementById('editMedium').value,
    theory:document.getElementById('editTheory').value.split(',').map(s=>s.trim()).filter(s=>s),
    desc:document.getElementById('editDesc').value,
    artistInfo:document.getElementById('editArtistInfo').value,
    url:document.getElementById('editUrl').value.trim(),
    img:document.getElementById('editImg').value.trim()
  };
  if(editingArtworkIndex>=0){
    artworks[editingArtworkIndex]=newData;
  }else{
    artworks.push(newData);
  }
  saveArtworks();
  renderWorks();
  if(editingArtworkIndex>=0){
    openDetail(editingArtworkIndex);
  }else{
    showPage('index');
  }
}

/* 初始化 */
renderStair();
showPage('home');
</script>
